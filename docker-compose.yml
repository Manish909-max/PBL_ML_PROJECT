version: '3.9'

services:
  web:
    build: .
    command: gunicorn ai_mock_interview.wsgi:application --bind 0.0.0.0:8000
    ports:
      - '8000:8000'
    environment:
      DJANGO_SECRET_KEY: development-secret
      DJANGO_DEBUG: 'True'
      DB_ENGINE: sqlite
    volumes:
      - .:/app
