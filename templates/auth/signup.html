<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - AI Mock Interview</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        
        .container { width: 100%; max-width: 400px; padding: 24px; }
        
        .card { background: white; border-radius: 12px; padding: 32px; box-shadow: 0 20px 50px rgba(0,0,0,0.2); }
        
        .logo { text-align: center; margin-bottom: 32px; }
        .logo h1 { font-size: 28px; color: #2563eb; margin-bottom: 8px; }
        .logo p { color: #666; font-size: 14px; }
        
        h2 { font-size: 24px; margin-bottom: 24px; color: #1a1a1a; text-align: center; }
        
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #1a1a1a; font-weight: 600; font-size: 14px; }
        input { width: 100%; padding: 12px; border: 2px solid #e5e7eb; border-radius: 8px; font-size: 14px; font-family: inherit; }
        input:focus { outline: none; border-color: #2563eb; }
        
        .error { background: #fee; color: #c33; padding: 12px; border-radius: 6px; margin-bottom: 20px; font-size: 14px; }
        .error.show { display: block; }
        
        .btn { width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: background 0.3s; }
        .btn:hover { background: #1d4ed8; }
        
        .links { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; font-size: 14px; }
        .links a { color: #2563eb; text-decoration: none; }
        .links a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="logo">
                <h1>📝 MockInterview</h1>
                <p>Start practicing today</p>
            </div>
            
            <h2>Create Account</h2>
            
            {% if error %}
                <div class="error show">{{ error }}</div>
            {% endif %}
            
            <form method="post">
                {% csrf_token %}
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required autofocus>
                </div>
                
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>
                
                <div class="form-group">
                    <label for="password_confirm">Confirm Password</label>
                    <input type="password" id="password_confirm" name="password_confirm" required>
                </div>
                
                <button type="submit" class="btn">Create Account</button>
            </form>
            
            <div class="links">
                <a href="{% url 'login' %}">Already have an account? Login</a>
                <a href="{% url 'home' %}">Back to home</a>
            </div>
        </div>
    </div>
</body>
</html>
